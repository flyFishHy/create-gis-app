<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoCore GIS Studio - 双模式地理信息看板</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              gis: {
                darkBg: '#0b1120',
                darkPanel: '#111827',
                darkBorder: '#1e293b',
                accent: '#3b82f6',
                cyan: '#06b6d4',
              },
            },
          },
        },
      };
    </script>

    <style>
      /* 自定义滚动条与毛玻璃核心样式 */
      * {
        box-sizing: border-box;
        user-select: none;
      }
      input,
      textarea,
      select {
        user-select: auto;
      }

      /* 自定义精细滚动条 */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.3);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.5);
      }

      /* 布局过渡动画 */
      .layout-transition {
        transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* ==========================================
       DOCKED（停靠模式）专属样式
       ========================================== */
      body[data-layout='docked'] #app-container {
        display: grid;
        grid-template-rows: 52px 1fr;
        grid-template-columns: 270px 1fr 290px;
        grid-template-areas:
          'header header header'
          'left center right';
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }

      body[data-layout='docked'].left-collapsed #app-container {
        grid-template-columns: 0px 1fr 290px;
      }
      body[data-layout='docked'].right-collapsed #app-container {
        grid-template-columns: 270px 1fr 0px;
      }
      body[data-layout='docked'].left-collapsed.right-collapsed #app-container {
        grid-template-columns: 0px 1fr 0px;
      }

      body[data-layout='docked'] #top-header {
        grid-area: header;
        border-bottom-width: 1px;
      }

      body[data-layout='docked'] #left-sidebar {
        grid-area: left;
        border-right-width: 1px;
        overflow: hidden;
      }

      body[data-layout='docked'] #center-workspace {
        grid-area: center;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }

      body[data-layout='docked'] #map-toolbar {
        border-bottom-width: 1px;
        z-index: 20;
      }

      body[data-layout='docked'] #map-viewport-wrapper {
        flex: 1;
        position: relative;
        overflow: hidden;
      }

      body[data-layout='docked'] #bottom-statusbar {
        border-top-width: 1px;
        z-index: 20;
      }

      body[data-layout='docked'] #right-sidebar {
        grid-area: right;
        border-left-width: 1px;
        overflow: hidden;
      }

      /* ==========================================
       OVERLAY（悬浮模式）专属样式
       ========================================== */
      body[data-layout='overlay'] #app-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      /* 让地图区域在 Overlay 模式下撑满全屏 */
      body[data-layout='overlay'] #center-workspace {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      body[data-layout='overlay'] #map-viewport-wrapper {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      /* 毛玻璃面板特效 */
      body[data-layout='overlay'] .glass-panel {
        backdrop-filter: blur(16px) saturate(180%);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
        box-shadow:
          0 10px 30px -5px rgba(0, 0, 0, 0.35),
          0 0 1px 1px rgba(255, 255, 255, 0.08);
      }

      html:not(.dark) body[data-layout='overlay'] .glass-panel {
        box-shadow:
          0 10px 25px -5px rgba(15, 23, 42, 0.12),
          0 0 1px 1px rgba(15, 23, 42, 0.08);
      }

      body[data-layout='overlay'] #top-header {
        position: fixed;
        top: 12px;
        left: 12px;
        right: 12px;
        height: 50px;
        border-radius: 14px;
        border-width: 1px;
        z-index: 40;
      }

      body[data-layout='overlay'] #map-toolbar {
        position: fixed;
        top: 74px;
        left: 296px;
        right: 316px;
        border-radius: 12px;
        border-width: 1px;
        z-index: 30;
      }

      body[data-layout='overlay'].left-collapsed #map-toolbar {
        left: 56px;
      }
      body[data-layout='overlay'].right-collapsed #map-toolbar {
        right: 56px;
      }

      body[data-layout='overlay'] #left-sidebar {
        position: fixed;
        top: 74px;
        left: 12px;
        bottom: 54px;
        width: 272px;
        border-radius: 14px;
        border-width: 1px;
        z-index: 30;
      }

      body[data-layout='overlay'].left-collapsed #left-sidebar {
        transform: translateX(-290px);
        opacity: 0;
        pointer-events: none;
      }

      body[data-layout='overlay'] #right-sidebar {
        position: fixed;
        top: 74px;
        right: 12px;
        bottom: 54px;
        width: 292px;
        border-radius: 14px;
        border-width: 1px;
        z-index: 30;
      }

      body[data-layout='overlay'].right-collapsed #right-sidebar {
        transform: translateX(310px);
        opacity: 0;
        pointer-events: none;
      }

      body[data-layout='overlay'] #bottom-statusbar {
        position: fixed;
        bottom: 12px;
        left: 12px;
        right: 12px;
        height: 32px;
        border-radius: 10px;
        border-width: 1px;
        z-index: 35;
      }

      /* 响应式小屏幕适配 */
      @media (max-width: 1024px) {
        body[data-layout='overlay'] #map-toolbar {
          left: 12px;
          right: 12px;
          overflow-x: auto;
        }
        body[data-layout='overlay'] #left-sidebar,
        body[data-layout='overlay'] #right-sidebar {
          top: 132px;
        }
      }

      /* Range Slider 样式 */
      input[type='range'] {
        -webkit-appearance: none;
        background: transparent;
      }
      input[type='range']::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 2px;
        background: rgba(148, 163, 184, 0.3);
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 12px;
        width: 12px;
        border-radius: 50%;
        background: #3b82f6;
        margin-top: -4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body
    data-layout="docked"
    class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased selection:bg-blue-500 selection:text-white"
  >
    <div id="app-container">
      <!-- ==================== 1. 顶部通栏 / 悬浮 Header ==================== -->
      <header
        id="top-header"
        class="glass-panel layout-transition flex items-center justify-between px-4 bg-white/95 dark:bg-slate-900/90 border-slate-200 dark:border-slate-800"
      >
        <!-- 左侧 Icon + 标题 -->
        <div class="flex items-center gap-3">
          <div
            class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-cyan-400 flex items-center justify-center text-white shadow-md shadow-blue-500/25"
          >
            <i data-lucide="globe-2" class="w-5 h-5"></i>
          </div>
          <div class="flex flex-col">
            <div class="flex items-center gap-2">
              <h1 id="app-title" class="font-bold text-sm sm:text-base tracking-tight"
                >GeoCore 空间地理信息看板</h1
              >
              <span
                class="hidden md:inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-mono font-medium bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20"
              >
                v3.4 PRO
              </span>
            </div>
          </div>
        </div>

        <!-- 右侧控制按钮组：[布局切换 Docked/Overlay] [主题切换 Sun/Moon] [语言切换 zh/en] -->
        <div class="flex items-center gap-2">
          <!-- 布局模式分段控制器 -->
          <div
            class="flex items-center p-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
            role="group"
          >
            <button
              id="btn-layout-docked"
              onclick="setLayoutMode('docked')"
              class="flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium transition-all bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-400 shadow-sm"
            >
              <i data-lucide="layout-panel-left" class="w-3.5 h-3.5"></i>
              <span data-i18n="layoutDocked">停靠</span>
            </button>
            <button
              id="btn-layout-overlay"
              onclick="setLayoutMode('overlay')"
              class="flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium transition-all text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200"
            >
              <i data-lucide="layers" class="w-3.5 h-3.5"></i>
              <span data-i18n="layoutOverlay">悬浮</span>
            </button>
          </div>

          <div class="h-4 w-[1px] bg-slate-200 dark:bg-slate-700 mx-0.5"></div>

          <!-- 主题切换按钮 (Sun / Moon) -->
          <button
            id="btn-theme"
            onclick="toggleTheme()"
            title="切换亮暗主题"
            class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-amber-400 transition-colors"
          >
            <i id="icon-theme-sun" data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
            <i
              id="icon-theme-moon"
              data-lucide="moon"
              class="w-4 h-4 block dark:hidden text-slate-700"
            ></i>
          </button>

          <!-- 语言切换按钮 (zh / en) -->
          <button
            id="btn-lang"
            onclick="toggleLanguage()"
            class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-xs font-mono font-semibold text-slate-700 dark:text-slate-200 transition-colors"
          >
            <i data-lucide="languages" class="w-3.5 h-3.5 text-blue-500"></i>
            <span id="lang-label">ZH / EN</span>
          </button>
        </div>
      </header>

      <!-- ==================== 2. 左侧边栏：图层管理 + 图例 ==================== -->
      <aside
        id="left-sidebar"
        class="glass-panel layout-transition flex flex-col bg-white/95 dark:bg-slate-900/85 border-slate-200 dark:border-slate-800"
      >
        <!-- 侧边栏顶部标题 -->
        <div
          class="flex items-center justify-between px-3.5 py-2.5 border-b border-slate-200 dark:border-slate-800 shrink-0"
        >
          <div
            class="flex items-center gap-2 font-semibold text-xs uppercase tracking-wider text-slate-600 dark:text-slate-300"
          >
            <i data-lucide="layers-3" class="w-4 h-4 text-blue-500"></i>
            <span data-i18n="layerManager">图层管理</span>
          </div>
          <button
            onclick="toggleSidebar('left')"
            class="p-1 rounded hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
            title="折叠面板"
          >
            <i data-lucide="panel-left-close" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- 上半部分：图层列表 -->
        <div id="layer-list-container" class="flex-1 overflow-y-auto p-3 space-y-2.5">
          <!-- 图层项由 JS 动态渲染 -->
        </div>

        <!-- 下半部分：动态图例 -->
        <div
          class="border-t border-slate-200 dark:border-slate-800 p-3.5 bg-slate-50/70 dark:bg-slate-950/50 shrink-0 max-h-[45%] overflow-y-auto"
        >
          <div class="flex items-center justify-between mb-2.5">
            <div
              class="flex items-center gap-1.5 font-semibold text-xs uppercase tracking-wider text-slate-600 dark:text-slate-300"
            >
              <i data-lucide="map-pin" class="w-3.5 h-3.5 text-cyan-500"></i>
              <span data-i18n="legendTitle">动态图例</span>
            </div>
            <span
              id="active-legend-count"
              class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400"
              >5 ACTIVE</span
            >
          </div>
          <div id="legend-items-container" class="space-y-2 text-xs">
            <!-- 图例项由 JS 根据激活图层动态生成 -->
          </div>
        </div>
      </aside>

      <!-- ==================== 3. 中央工作区：工具栏 + 地图视口 + 底部状态栏 ==================== -->
      <main id="center-workspace">
        <!-- 顶部工具栏：[搜索框] [时间选择器] ... [绘制点][绘制线][绘制面][测量][清除] -->
        <div
          id="map-toolbar"
          class="glass-panel layout-transition flex flex-wrap items-center justify-between gap-2 px-3 py-2 bg-white/95 dark:bg-slate-900/85 border-slate-200 dark:border-slate-800"
        >
          <!-- 左侧：搜索框 + 时间选择器 -->
          <div class="flex items-center gap-2 flex-wrap">
            <!-- 搜索定位框 -->
            <div class="relative">
              <i
                data-lucide="search"
                class="w-3.5 h-3.5 absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"
              ></i>
              <input
                id="search-input"
                type="text"
                data-i18n-placeholder="searchPlaceholder"
                placeholder="搜索监测站、管线或区域..."
                class="w-44 sm:w-56 pl-8 pr-3 py-1.5 text-xs rounded-lg bg-slate-100 dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-blue-500 text-slate-800 dark:text-slate-100 placeholder-slate-400"
                oninput="handleSearchInput(this.value)"
                onfocus="handleSearchInput(this.value)"
              />
              <!-- 搜索下拉建议列表 -->
              <div
                id="search-results-dropdown"
                class="hidden absolute left-0 mt-1.5 w-64 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-xl z-50 max-h-60 overflow-y-auto py-1"
              >
              </div>
            </div>

            <!-- 时间选择器 (TimePicker) -->
            <div
              class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700"
            >
              <i data-lucide="clock" class="w-3.5 h-3.5 text-cyan-500 shrink-0"></i>
              <select
                id="time-picker"
                onchange="handleTimeChange(this.value)"
                class="bg-transparent text-xs font-mono text-slate-700 dark:text-slate-200 focus:outline-none cursor-pointer"
              >
                <option value="2026-11-17T08:00" class="dark:bg-slate-800"
                  >2026-11-17 08:00 (早高峰)</option
                >
                <option value="2026-11-17T12:00" class="dark:bg-slate-800"
                  >2026-11-17 12:00 (正午时段)</option
                >
                <option value="2026-11-17T15:30" selected class="dark:bg-slate-800"
                  >2026-11-17 15:30 (当前实时)</option
                >
                <option value="2026-11-17T20:00" class="dark:bg-slate-800"
                  >2026-11-17 20:00 (夜间负荷)</option
                >
              </select>
            </div>
          </div>

          <!-- 右侧：GIS 绘制与空间量测工具组 -->
          <div class="flex items-center gap-1">
            <button
              id="tool-pan"
              onclick="setActiveTool('pan')"
              class="tool-btn active flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-blue-600 text-white shadow-sm transition-all"
              title="漫游选择"
            >
              <i data-lucide="mouse-pointer-2" class="w-3.5 h-3.5"></i>
              <span class="hidden xl:inline" data-i18n="toolSelect">选择</span>
            </button>

            <button
              id="tool-point"
              onclick="setActiveTool('point')"
              class="tool-btn flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all"
              title="绘制点要素"
            >
              <i data-lucide="map-pin-plus" class="w-3.5 h-3.5 text-emerald-500"></i>
              <span class="hidden sm:inline" data-i18n="toolPoint">绘制点</span>
            </button>

            <button
              id="tool-line"
              onclick="setActiveTool('line')"
              class="tool-btn flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all"
              title="绘制线要素"
            >
              <i data-lucide="polyline" class="w-3.5 h-3.5 text-amber-500"></i>
              <span class="hidden sm:inline" data-i18n="toolLine">绘制线</span>
            </button>

            <button
              id="tool-polygon"
              onclick="setActiveTool('polygon')"
              class="tool-btn flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all"
              title="绘制面要素"
            >
              <i data-lucide="pentagon" class="w-3.5 h-3.5 text-purple-500"></i>
              <span class="hidden sm:inline" data-i18n="toolPolygon">绘制面</span>
            </button>

            <button
              id="tool-measure"
              onclick="setActiveTool('measure')"
              class="tool-btn flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all"
              title="距离与面积量测"
            >
              <i data-lucide="ruler" class="w-3.5 h-3.5 text-cyan-500"></i>
              <span class="hidden sm:inline" data-i18n="toolMeasure">测量</span>
            </button>

            <div class="h-4 w-[1px] bg-slate-200 dark:bg-slate-700 mx-0.5"></div>

            <button
              onclick="clearMeasurementsAndTemp()"
              class="flex items-center gap-1 px-2 py-1.5 rounded-lg text-xs font-medium text-rose-500 hover:bg-rose-500/10 transition-all"
              title="清除测量与临时图形"
            >
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              <span class="hidden md:inline" data-i18n="toolClear">清除</span>
            </button>
          </div>
        </div>

        <!-- 中央 mapViewport 地图画布容器 -->
        <div id="map-viewport-wrapper">
          <canvas
            id="gis-canvas"
            class="w-full h-full block cursor-grab active:cursor-grabbing"
          ></canvas>

          <!-- 侧边栏折叠后的快捷唤醒按钮 -->
          <button
            id="btn-expand-left"
            onclick="toggleSidebar('left')"
            class="hidden absolute top-3 left-3 z-20 p-2 rounded-lg bg-white/90 dark:bg-slate-900/90 backdrop-blur border border-slate-200 dark:border-slate-700 shadow-lg text-slate-700 dark:text-slate-200 hover:text-blue-500"
            title="展开图层面板"
          >
            <i data-lucide="panel-left-open" class="w-4 h-4"></i>
          </button>
          <button
            id="btn-expand-right"
            onclick="toggleSidebar('right')"
            class="hidden absolute top-3 right-3 z-20 p-2 rounded-lg bg-white/90 dark:bg-slate-900/90 backdrop-blur border border-slate-200 dark:border-slate-700 shadow-lg text-slate-700 dark:text-slate-200 hover:text-blue-500"
            title="展开属性面板"
          >
            <i data-lucide="panel-right-open" class="w-4 h-4"></i>
          </button>

          <!-- 绘制/量测实时操作提示浮窗 -->
          <div
            id="tool-hint-banner"
            class="hidden absolute top-3 left-1/2 -translate-x-1/2 z-20 px-3.5 py-1.5 rounded-full bg-slate-900/90 dark:bg-blue-600/95 text-white text-xs font-medium shadow-lg backdrop-blur flex items-center gap-2 border border-white/15"
          >
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            <span id="tool-hint-text">点击地图添加顶点，双击完成绘制</span>
          </div>

          <!-- 实时量测结果悬浮卡片 -->
          <div
            id="measure-result-card"
            class="hidden absolute bottom-12 left-1/2 -translate-x-1/2 z-20 px-4 py-2 rounded-xl bg-slate-900/95 text-white border border-cyan-500/40 shadow-xl backdrop-blur text-xs font-mono flex items-center gap-4"
          >
            <div>
              <span class="text-slate-400" data-i18n="measureDist">总距离:</span>
              <span id="measure-dist-val" class="text-cyan-400 font-bold ml-1">0.00 km</span>
            </div>
            <div id="measure-area-box" class="hidden border-l border-slate-700 pl-4">
              <span class="text-slate-400" data-i18n="measureArea">闭合面积:</span>
              <span id="measure-area-val" class="text-emerald-400 font-bold ml-1">0.00 km²</span>
            </div>
          </div>

      function getMetersPerPixel() {
        // 标准 Web Mercator 地面分辨率公式
        const latRad = (state.map.centerLat * Math.PI) / 180;
        return (156543.03392 * Math.cos(latRad)) / Math.pow(2, state.map.zoom);

        const mpp = getMetersPerPixel();
        const metersPerDegLat = 111320;
        const metersPerDegLon = 111320 * Math.cos((state.map.centerLat * Math.PI) / 180);

        const dxMeters = (lon - state.map.centerLon) * metersPerDegLon;
        const dyMeters = (lat - state.map.centerLat) * metersPerDegLat;

        const x = canvas.clientWidth / 2 + dxMeters / mpp;
        const y = canvas.clientHeight / 2 - dyMeters / mpp;
        return { x, y };

        const dxMeters = (x - canvas.clientWidth / 2) * mpp;
        const dyMeters = (canvas.clientHeight / 2 - y) * mpp;

        const lon = state.map.centerLon + dxMeters / metersPerDegLon;
        const lat = state.map.centerLat + dyMeters / metersPerDegLat;
        return { lon, lat };

          Math.cos((p1[1] * Math.PI) / 180) *
            Math.cos((p2[1] * Math.PI) / 180) *
            Math.sin(dLon / 2) *
            Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;

        const mPerDegLat = 111320;
        const mPerDegLon = 111320 * Math.cos((refLat * Math.PI) / 180);

        let area = 0;
        for (let i = 0; i < coords.length; i++) {
          const j = (i + 1) % coords.length;
          const x1 = coords[i][0] * mPerDegLon;
          const y1 = coords[i][1] * mPerDegLat;
          const x2 = coords[j][0] * mPerDegLon;
          const y2 = coords[j][1] * mPerDegLat;
          area += x1 * y2 - x2 * y1;
        }
        return Math.abs(area / 2) / 1_000_000;
      }

      function getFeatureCenter(f) {
        if (f.geomType === 'point') return f.coords;
        let sumLon = 0,
          sumLat = 0;
        f.coords.forEach((c) => {
          sumLon += c[0];
          sumLat += c[1];
        });
        return [sumLon / f.coords.length, sumLat / f.coords.length];
      }

      /**
       * =========================================================================
       * 高性能矢量瓦片模拟与 GIS 地图渲染循环
       * =========================================================================
       */
      function resizeCanvas() {
        const wrapper = document.getElementById('map-viewport-wrapper');
        const dpr = window.devicePixelRatio || 1;
        canvas.width = wrapper.clientWidth * dpr;
        canvas.height = wrapper.clientHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        renderMap();
      }

      function renderMap() {
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        if (w === 0 || h === 0) return;

        const isDark = state.theme === 'dark';

        // 1. 底图背景色
        ctx.fillStyle = isDark ? '#090f1d' : '#eef2f6';
        ctx.fillRect(0, 0, w, h);

        // 2. 绘制模拟矢量底图地理要素（黄浦江水系 + 城市主干路网 + 街区肌理）
        drawBaseVectorGeography(isDark);

        // 3. 绘制经纬参考网格图层
        const gridLayer = layers.find((l) => l.id === 'grid');
        if (gridLayer && gridLayer.visible) {
          drawCoordinateGrid(isDark, gridLayer.opacity);
        }

        // 4. 绘制面状功能区图层 (Polygon)
        const zoneLayer = layers.find((l) => l.id === 'zones');
        if (zoneLayer && zoneLayer.visible) {
          features
            .filter((f) => f.layerId === 'zones')
            .forEach((f) => {
              drawPolygonFeature(f, zoneLayer.opacity, isDark);
            });
        }

        // 5. 绘制负荷热力图图层 (Heatmap)
        const heatLayer = layers.find((l) => l.id === 'heatmap');
        if (heatLayer && heatLayer.visible) {
          drawHeatmapLayer(heatLayer.opacity);
        }

        // 6. 绘制管线/道路网络图层 (LineString)
        const pipeLayer = layers.find((l) => l.id === 'pipelines');
        if (pipeLayer && pipeLayer.visible) {
          features
            .filter((f) => f.layerId === 'pipelines')
            .forEach((f) => {
              drawLineFeature(f, pipeLayer.opacity, isDark);
            });
        }

        // 7. 绘制监测站与点要素图层 (Point)
        const sensorLayer = layers.find((l) => l.id === 'sensors');
        if (sensorLayer && sensorLayer.visible) {
          features
            .filter((f) => f.layerId === 'sensors')
            .forEach((f) => {
              drawPointFeature(f, sensorLayer.opacity, isDark);
            });
        }

        // 8. 绘制已保存的空间量测结果
        state.measurements.forEach((m) => drawMeasurementOverlay(m, isDark, false));

        // 9. 绘制当前正在交互绘制/测量的草图
        if (state.tempVertices.length > 0) {
          const previewCoords = [...state.tempVertices];
          if (state.mouseGeoPos) {
            previewCoords.push([state.mouseGeoPos.lon, state.mouseGeoPos.lat]);
          }
          drawActiveSketch(previewCoords, isDark);
        }

        // 更新底部比例尺
        updateScaleBarUI();
      }

      // 绘制逼真的黄浦江水系与城市道路底图
      function drawBaseVectorGeography(isDark) {
        // 模拟黄浦江蜿蜒河道多边形
        const riverCoords = [
          [121.488, 31.26],
          [121.4955, 31.25],
          [121.493, 31.241],
          [121.491, 31.23],
          [121.4875, 31.218],
          [121.475, 31.205],
          [121.481, 31.203],
          [121.4935, 31.2175],
          [121.4968, 31.2305],
          [121.4988, 31.2415],
          [121.5015, 31.2505],
          [121.4945, 31.26],
        ];

        ctx.save();
        ctx.beginPath();
        riverCoords.forEach((c, idx) => {
          const pt = geoToScreen(c[0], c[1]);
          if (idx === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.closePath();
        ctx.fillStyle = isDark ? '#0f2544' : '#bae6fd';
        ctx.fill();
        ctx.strokeStyle = isDark ? '#1e3a8a' : '#7dd3fc';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 模拟城市主干路网骨架
        const roads = [
          // 世纪大道
          [
            [121.4965, 31.2395],
            [121.515, 31.231],
            [121.538, 31.22],
          ],
          // 延安东路隧道及高架
          [
            [121.468, 31.232],
            [121.492, 31.234],
            [121.516, 31.236],
          ],
          // 浦东南路
          [
            [121.504, 31.252],
            [121.5055, 31.235],
            [121.502, 31.215],
          ],
          // 中山东一路(外滩)
          [
            [121.486, 31.25],
            [121.4885, 31.236],
            [121.485, 31.22],
          ],
          // 杨高南路
          [
            [121.525, 31.252],
            [121.524, 31.232],
            [121.521, 31.21],
          ],
        ];

        ctx.strokeStyle = isDark ? 'rgba(51, 65, 85, 0.55)' : 'rgba(203, 213, 225, 0.9)';
        ctx.lineWidth = state.map.zoom > 13 ? 3 : 1.8;
        roads.forEach((road) => {
          ctx.beginPath();
          road.forEach((c, i) => {
            const pt = geoToScreen(c[0], c[1]);
            if (i === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          });
          ctx.stroke();
        });

        // 水系注记
        const riverLabelPt = geoToScreen(121.4932, 31.2355);
        ctx.font = 'italic 600 11px Inter, sans-serif';
        ctx.fillStyle = isDark ? 'rgba(96, 165, 250, 0.45)' : 'rgba(2, 132, 199, 0.55)';
        ctx.textAlign = 'center';
        ctx.fillText(
          state.lang === 'zh' ? '黄 浦 江' : 'HUANGPU RIVER',
          riverLabelPt.x,
          riverLabelPt.y
        );
        ctx.restore();
      }

      // 绘制 WGS84 经纬网格
      function drawCoordinateGrid(isDark, opacity) {
        const topLeft = screenToGeo(0, 0);
        const bottomRight = screenToGeo(canvas.clientWidth, canvas.clientHeight);
        const step = state.map.zoom >= 14 ? 0.005 : 0.01;

        const startLon = Math.floor(topLeft.lon / step) * step;
        const endLon = Math.ceil(bottomRight.lon / step) * step;
        const startLat = Math.floor(bottomRight.lat / step) * step;
        const endLat = Math.ceil(topLeft.lat / step) * step;

        ctx.save();
        ctx.globalAlpha = opacity * 0.4;
        ctx.strokeStyle = isDark ? '#334155' : '#94a3b8';
        ctx.lineWidth = 0.8;
        ctx.setLineDash([4, 4]);
        ctx.font = '10px "JetBrains Mono", monospace';
        ctx.fillStyle = isDark ? '#64748b' : '#64748b';

        for (let lon = startLon; lon <= endLon; lon += step) {
          const pt = geoToScreen(lon, state.map.centerLat);
          ctx.beginPath();
          ctx.moveTo(pt.x, 0);
          ctx.lineTo(pt.x, canvas.clientHeight);
          ctx.stroke();
          ctx.fillText(`${lon.toFixed(3)}°E`, pt.x + 3, 14);
        }

        for (let lat = startLat; lat <= endLat; lat += step) {
          const pt = geoToScreen(state.map.centerLon, lat);
          ctx.beginPath();
          ctx.moveTo(0, pt.y);
          ctx.lineTo(canvas.clientWidth, pt.y);
          ctx.stroke();
          ctx.fillText(`${lat.toFixed(3)}°N`, 6, pt.y - 3);
        }
        ctx.restore();
      }

      // 绘制多边形面要素
      function drawPolygonFeature(f, opacity, isDark) {
        const isSelected = state.selectedFeatureId === f.id;
        const isHovered = state.hoveredFeatureId === f.id;

        ctx.save();
        ctx.beginPath();
        f.coords.forEach((c, i) => {
          const pt = geoToScreen(c[0], c[1]);
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.closePath();

        ctx.globalAlpha = opacity * (isSelected || isHovered ? 0.48 : 0.28);
        ctx.fillStyle = f.fillColor || '#3b82f6';
        ctx.fill();

        ctx.globalAlpha = opacity;
        ctx.lineWidth = isSelected ? 3 : isHovered ? 2.5 : 1.6;
        ctx.strokeStyle = isSelected ? '#ffffff' : f.strokeColor || '#60a5fa';
        if (!isDark && isSelected) ctx.strokeStyle = '#1d4ed8';
        ctx.stroke();

        // 中心注记标签
        const center = getFeatureCenter(f);
        const cpt = geoToScreen(center[0], center[1]);
        ctx.globalAlpha = Math.min(1, opacity + 0.15);
        ctx.font = '600 11px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = isDark ? '#e2e8f0' : '#1e293b';
        const label = state.lang === 'zh' ? f.name : f.nameEn || f.name;
        ctx.fillText(label, cpt.x, cpt.y);
        ctx.restore();
      }

      // 绘制热力场渲染
      function drawHeatmapLayer(opacity) {
        const mult = TIME_MULTIPLIERS[state.timeSlot]?.factor || 1;
        const sensorFeatures = features.filter((f) => f.geomType === 'point');

        ctx.save();
        ctx.globalAlpha = opacity * 0.75;
        ctx.globalCompositeOperation = state.theme === 'dark' ? 'screen' : 'multiply';

        sensorFeatures.forEach((ptFeature) => {
          const pt = geoToScreen(ptFeature.coords[0], ptFeature.coords[1]);
          const radius =
            (state.map.zoom - 8) * 16 * (ptFeature.status === 'warning' ? 1.35 : 1.0) * mult;
          if (radius <= 0) return;

          const grad = ctx.createRadialGradient(pt.x, pt.y, 2, pt.x, pt.y, radius);
          if (ptFeature.status === 'warning') {
            grad.addColorStop(0, 'rgba(239, 68, 68, 0.85)');
            grad.addColorStop(0.45, 'rgba(245, 158, 11, 0.45)');
            grad.addColorStop(1, 'rgba(245, 158, 11, 0)');
          } else {
            grad.addColorStop(0, 'rgba(6, 182, 212, 0.75)');
            grad.addColorStop(0.5, 'rgba(16, 185, 129, 0.35)');
            grad.addColorStop(1, 'rgba(16, 185, 129, 0)');
          }

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }

      // 绘制线要素 (管线/道路)
      function drawLineFeature(f, opacity, isDark) {
        const isSelected = state.selectedFeatureId === f.id;
        const isHovered = state.hoveredFeatureId === f.id;

        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.beginPath();
        f.coords.forEach((c, i) => {
          const pt = geoToScreen(c[0], c[1]);
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });

        if (isSelected || isHovered) {
          ctx.shadowColor = f.strokeColor || '#06b6d4';
          ctx.shadowBlur = 12;
        }

        ctx.lineWidth = isSelected ? 5 : isHovered ? 4 : 3;
        ctx.strokeStyle = isSelected
          ? isDark
            ? '#ffffff'
            : '#1d4ed8'
          : f.strokeColor || '#06b6d4';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (f.dashed) ctx.setLineDash([8, 6]);
        ctx.stroke();

        // 绘制顶点节点
        ctx.setLineDash([]);
        f.coords.forEach((c) => {
          const pt = geoToScreen(c[0], c[1]);
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, isSelected ? 4 : 2.5, 0, Math.PI * 2);
          ctx.fillStyle = isDark ? '#0f172a' : '#ffffff';
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = f.strokeColor || '#06b6d4';
          ctx.stroke();
        });
        ctx.restore();
      }

      // 绘制点要素 (监测站)
      function drawPointFeature(f, opacity, isDark) {
        const pt = geoToScreen(f.coords[0], f.coords[1]);
        const isSelected = state.selectedFeatureId === f.id;
        const isHovered = state.hoveredFeatureId === f.id;

        const statusColors = {
          normal: '#10b981',
          warning: '#f59e0b',
          maintenance: '#ef4444',
        };
        const color = statusColors[f.status] || '#3b82f6';

        ctx.save();
        ctx.globalAlpha = opacity;

        // 选中外圈光晕环
        if (isSelected || isHovered) {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, isSelected ? 16 : 13, 0, Math.PI * 2);
          ctx.fillStyle = isSelected ? 'rgba(59, 130, 246, 0.25)' : 'rgba(255, 255, 255, 0.15)';
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = '#3b82f6';
          ctx.stroke();
        }

        // 主圆点
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, isSelected ? 7.5 : 6, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = isDark ? '#0f172a' : '#ffffff';
        ctx.stroke();

        // 数值与名称气泡标注 (Zoom >= 12 时显示)
        if (state.map.zoom >= 12 || isSelected || isHovered) {
          const mult = TIME_MULTIPLIERS[state.timeSlot]?.factor || 1;
          const dynamicVal =
            f.status === 'maintenance' ? 0 : (f.baseValue * mult).toFixed(f.baseValue < 10 ? 2 : 0);
          const nameText = state.lang === 'zh' ? f.name : f.nameEn || f.name;
          const label = `${nameText} (${dynamicVal} ${f.unit})`;

          ctx.font = '500 11px Inter, sans-serif';
          const textWidth = ctx.measureText(label).width;
          const boxW = textWidth + 14;
          const boxH = 22;
          const boxX = pt.x - boxW / 2;
          const boxY = pt.y - 32;

          // 圆角背景框
          ctx.fillStyle = isDark ? 'rgba(15, 23, 42, 0.88)' : 'rgba(255, 255, 255, 0.92)';
          ctx.beginPath();
          ctx.roundRect(boxX, boxY, boxW, boxH, 6);
          ctx.fill();
          ctx.lineWidth = 1;
          ctx.strokeStyle = isSelected
            ? '#3b82f6'
            : isDark
              ? 'rgba(148, 163, 184, 0.25)'
              : 'rgba(15, 23, 42, 0.15)';
          ctx.stroke();

          ctx.fillStyle = isDark ? '#f1f5f9' : '#0f172a';
          ctx.textAlign = 'center';
          ctx.fillText(label, pt.x, boxY + 14.5);
        }

        ctx.restore();
      }

      // 绘制正在绘制或测量的草图
      function drawActiveSketch(coords, isDark) {
        if (coords.length === 0) return;
        ctx.save();
        ctx.beginPath();
        coords.forEach((c, i) => {
          const pt = geoToScreen(c[0], c[1]);
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });

        if (
          (state.activeTool === 'polygon' || state.activeTool === 'measure') &&
          coords.length >= 3
        ) {
          ctx.closePath();
          ctx.fillStyle =
            state.activeTool === 'measure' ? 'rgba(6, 182, 212, 0.18)' : 'rgba(168, 85, 247, 0.22)';
          ctx.fill();
        }

        ctx.lineWidth = 2.5;
        ctx.strokeStyle = state.activeTool === 'measure' ? '#06b6d4' : '#a855f7';
        ctx.setLineDash([6, 4]);
        ctx.stroke();

        // 顶点圆点
        ctx.setLineDash([]);
        coords.forEach((c) => {
          const pt = geoToScreen(c[0], c[1]);
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 4.5, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#06b6d4';
          ctx.stroke();
        });

        // 实时更新测量卡片数值
        if (state.activeTool === 'measure' && coords.length >= 2) {
          const distKm = calcPolylineLengthKm(coords);
          const areaKm2 = coords.length >= 3 ? calcPolygonAreaKm2(coords) : 0;
          const card = document.getElementById('measure-result-card');
          card.classList.remove('hidden');
          document.getElementById('measure-dist-val').textContent =
            distKm < 1 ? `${(distKm * 1000).toFixed(1)} m` : `${distKm.toFixed(3)} km`;

          const areaBox = document.getElementById('measure-area-box');
          if (coords.length >= 3) {
            areaBox.classList.remove('hidden');
            document.getElementById('measure-area-val').textContent = `${areaKm2.toFixed(3)} km²`;
          } else {
            areaBox.classList.add('hidden');
          }
        }
        ctx.restore();
      }

      // 绘制已固化的测量标注
      function drawMeasurementOverlay(m, isDark) {
        const coords = m.coords;
        if (coords.length < 2) return;
        ctx.save();
        ctx.beginPath();
        coords.forEach((c, i) => {
          const pt = geoToScreen(c[0], c[1]);
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        if (coords.length >= 3) {
          ctx.closePath();
          ctx.fillStyle = 'rgba(6, 182, 212, 0.14)';
          ctx.fill();
        }
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.stroke();

        // 终点标签
        const last = geoToScreen(coords[coords.length - 1][0], coords[coords.length - 1][1]);
        const distKm = calcPolylineLengthKm(coords);
        const areaKm2 = coords.length >= 3 ? calcPolygonAreaKm2(coords) : 0;
        const text =
          coords.length >= 3
            ? `${distKm.toFixed(2)} km | ${areaKm2.toFixed(3)} km²`
            : `${distKm.toFixed(2)} km`;

        ctx.setLineDash([]);
        ctx.font = '600 11px "JetBrains Mono", monospace';
        const w = ctx.measureText(text).width + 14;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.beginPath();
        ctx.roundRect(last.x + 8, last.y - 12, w, 22, 6);
        ctx.fill();
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = '#22d3ee';
        ctx.textAlign = 'left';
        ctx.fillText(text, last.x + 15, last.y + 3);
        ctx.restore();
      }

      /**
       * =========================================================================
       * 地图鼠标交互事件（平移、缩放、点选命中测试、绘制与测量）
       * =========================================================================
       */
      function hitTestFeatures(screenX, screenY) {
        // 1. 优先检测点要素 (半径 14px)
        const sensorLayer = layers.find((l) => l.id === 'sensors');
        if (sensorLayer && sensorLayer.visible) {
          const pts = features.filter((f) => f.layerId === 'sensors');
          for (let i = pts.length - 1; i >= 0; i--) {
            const pt = geoToScreen(pts[i].coords[0], pts[i].coords[1]);
            const dist = Math.hypot(pt.x - screenX, pt.y - screenY);
            if (dist <= 14) return pts[i];
          }
        }

        // 2. 检测线要素 (点到线段距离 <= 8px)
        const pipeLayer = layers.find((l) => l.id === 'pipelines');
        if (pipeLayer && pipeLayer.visible) {
          const lines = features.filter((f) => f.layerId === 'pipelines');
          for (let f of lines) {
            for (let i = 0; i < f.coords.length - 1; i++) {
              const p1 = geoToScreen(f.coords[i][0], f.coords[i][1]);
              const p2 = geoToScreen(f.coords[i + 1][0], f.coords[i + 1][1]);
              if (distToSegment({ x: screenX, y: screenY }, p1, p2) <= 8) {
                return f;
              }
            }
          }
        }

        // 3. 检测面要素 (射线法 Point in Polygon)
        const zoneLayer = layers.find((l) => l.id === 'zones');
        if (zoneLayer && zoneLayer.visible) {
          const polys = features.filter((f) => f.layerId === 'zones');
          for (let i = polys.length - 1; i >= 0; i--) {
            const screenPoly = polys[i].coords.map((c) => geoToScreen(c[0], c[1]));
            if (pointInPolygon({ x: screenX, y: screenY }, screenPoly)) {
              return polys[i];
            }
          }
        }

        return null;
      }

      function distToSegment(p, v, w) {
        const l2 = Math.pow(v.x - w.x, 2) + Math.pow(v.y - w.y, 2);
        if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
        let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
      }

      function pointInPolygon(point, vs) {
        let inside = false;
        for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
          const xi = vs[i].x,
            yi = vs[i].y;
          const xj = vs[j].x,
            yj = vs[j].y;
          const intersect =
            yi > point.y !== yj > point.y &&
            point.x < ((xj - xi) * (point.y - yi)) / (yj - yi) + xi;
          if (intersect) inside = !inside;
        }
        return inside;
      }

      // 绑定 Canvas 交互事件
      canvas.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        state.map.isDragging = true;
        state.map.dragStartX = x;
        state.map.dragStartY = y;
        state.map.dragStartLon = state.map.centerLon;
        state.map.dragStartLat = state.map.centerLat;
      });

      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const geo = screenToGeo(x, y);
        state.map.mouseLon = geo.lon;
        state.map.mouseLat = geo.lat;
        state.mouseGeoPos = geo;

        // 更新底部状态栏实时经纬度
        document.getElementById('status-coords').textContent =
          `${geo.lon.toFixed(4)}° E, ${geo.lat.toFixed(4)}° N`;

        if (state.map.isDragging) {
          const dx = x - state.map.dragStartX;
          const dy = y - state.map.dragStartY;
          const mpp = getMetersPerPixel();
          const metersPerDegLat = 111320;
          const metersPerDegLon = 111320 * Math.cos((state.map.dragStartLat * Math.PI) / 180);

          state.map.centerLon = state.map.dragStartLon - (dx * mpp) / metersPerDegLon;
          state.map.centerLat = state.map.dragStartLat + (dy * mpp) / metersPerDegLat;
          renderMap();
          return;
        }

        if (state.activeTool === 'pan') {
          const hit = hitTestFeatures(x, y);
          const newHoverId = hit ? hit.id : null;
          canvas.style.cursor = hit ? 'pointer' : 'grab';
          if (newHoverId !== state.hoveredFeatureId) {
            state.hoveredFeatureId = newHoverId;
            renderMap();
          }
        } else {
          canvas.style.cursor = 'crosshair';
          if (state.tempVertices.length > 0) {
            renderMap();
          }
        }
      });

      canvas.addEventListener('mouseup', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const movedDist = Math.hypot(x - state.map.dragStartX, y - state.map.dragStartY);
        state.map.isDragging = false;

        // 判定为点击而非拖拽
        if (movedDist < 5) {
          handleMapClick(x, y);
        }
      });

      canvas.addEventListener('dblclick', (e) => {
        if (
          ['line', 'polygon', 'measure'].includes(state.activeTool) &&
          state.tempVertices.length >= 2
        ) {
          finishSketchGeometry();
        }
      });

      canvas.addEventListener(
        'wheel',
        (e) => {
          e.preventDefault();
          const delta = e.deltaY < 0 ? 0.45 : -0.45;
          zoomMap(delta);
        },
        { passive: false }
      );

      // 处理地图点击动作
      function handleMapClick(x, y) {
        const geo = screenToGeo(x, y);

        if (state.activeTool === 'pan') {
          const hit = hitTestFeatures(x, y);
          state.selectedFeatureId = hit ? hit.id : null;
          renderAttributePanel();
          renderMap();
          return;
        }

        if (state.activeTool === 'point') {
          const newId = `PT-${Math.floor(106 + Math.random() * 890)}`;
          const newFeature = {
            id: newId,
            layerId: 'sensors',
            geomType: 'point',
            name:
              state.lang === 'zh'
                ? `新建监测终端 #${newId.split('-')[1]}`
                : `New Station #${newId.split('-')[1]}`,
            nameEn: `New Station #${newId.split('-')[1]}`,
            category: '自定义采集点',
            status: 'normal',
            baseValue: 520,
            unit: 'm³/h',
            notes: '通过 GIS 看板交互绘制新增的空间监测点。',
            coords: [Number(geo.lon.toFixed(5)), Number(geo.lat.toFixed(5))],
          };
          features.push(newFeature);
          state.selectedFeatureId = newId;
          setActiveTool('pan');
          renderAttributePanel();
          renderMap();
          showToast(I18N[state.lang].toastCreated);
          return;
        }

        if (['line', 'polygon', 'measure'].includes(state.activeTool)) {
          state.tempVertices.push([Number(geo.lon.toFixed(5)), Number(geo.lat.toFixed(5))]);
          renderMap();
        }
      }

      // 完成多顶点线/面/测量绘制
      function finishSketchGeometry() {
        // 双击通常会触发两次 click，去除末尾重复点
        const pts = [...state.tempVertices];
        if (pts.length >= 2) {
          const last = pts[pts.length - 1];
          const prev = pts[pts.length - 2];
          if (Math.abs(last[0] - prev[0]) < 1e-6 && Math.abs(last[1] - prev[1]) < 1e-6) {
            pts.pop();
          }
        }

        if (state.activeTool === 'measure' && pts.length >= 2) {
          state.measurements.push({ coords: pts });
          state.tempVertices = [];
          setActiveTool('pan');
          renderMap();
          return;
        }

        if (state.activeTool === 'line' && pts.length >= 2) {
          const newId = `PL-${Math.floor(203 + Math.random() * 700)}`;
          features.push({
            id: newId,
            layerId: 'pipelines',
            geomType: 'line',
            name:
              state.lang === 'zh'
                ? `新建管线路径 #${newId.split('-')[1]}`
                : `New Pipeline #${newId.split('-')[1]}`,
            nameEn: `New Pipeline #${newId.split('-')[1]}`,
            category: '自定义规划管线',
            status: 'normal',
            strokeColor: '#06b6d4',
            dashed: false,
            baseValue: 0.5,
            unit: 'MPa',
            notes: '在线绘制生成的矢量管线要素。',
            coords: pts,
          });
          state.selectedFeatureId = newId;
          state.tempVertices = [];
          setActiveTool('pan');
          renderAttributePanel();
          renderMap();
          showToast(I18N[state.lang].toastCreated);
          return;
        }

        if (state.activeTool === 'polygon' && pts.length >= 3) {
          const newId = `ZN-${Math.floor(10 + Math.random() * 89)}`;
          features.push({
            id: newId,
            layerId: 'zones',
            geomType: 'polygon',
            name:
              state.lang === 'zh'
                ? `新建规划片区 #${newId.split('-')[1]}`
                : `New Zone #${newId.split('-')[1]}`,
            nameEn: `New Zone #${newId.split('-')[1]}`,
            category: '自定义空间多边形',
            status: 'normal',
            fillColor: '#a855f7',
            strokeColor: '#c084fc',
            baseValue: 65,
            unit: '% 负荷',
            notes: '在线勾绘生成的自定义功能区域。',
            coords: pts,
          });
          state.selectedFeatureId = newId;
          state.tempVertices = [];
          setActiveTool('pan');
          renderAttributePanel();
          renderMap();
          showToast(I18N[state.lang].toastCreated);
        }
      }

      /**
       * =========================================================================
       * 相机缩放、飞行定位 (FlyTo) 与比例尺更新
       * =========================================================================
       */
      function zoomMap(delta) {
        state.map.zoom = Math.max(
          state.map.minZoom,
          Math.min(state.map.maxZoom, state.map.zoom + delta)
        );
        document.getElementById('status-zoom').textContent = `Z${state.map.zoom.toFixed(1)}`;
        renderMap();
      }

      function resetMapView() {
        flyToLocation(121.495, 31.235, 13.2);
      }

      function flyToLocation(targetLon, targetLat, targetZoom = 14.5) {
        if (state.map.flyAnim) cancelAnimationFrame(state.map.flyAnim);

        const startLon = state.map.centerLon;
        const startLat = state.map.centerLat;
        const startZoom = state.map.zoom;
        const duration = 650;
        const startTime = performance.now();

        function step(now) {
          const t = Math.min(1, (now - startTime) / duration);
          // EaseOutCubic 缓动曲线
          const ease = 1 - Math.pow(1 - t, 3);

          state.map.centerLon = startLon + (targetLon - startLon) * ease;
          state.map.centerLat = startLat + (targetLat - startLat) * ease;
          state.map.zoom = startZoom + (targetZoom - startZoom) * ease;

          document.getElementById('status-zoom').textContent = `Z${state.map.zoom.toFixed(1)}`;
          renderMap();

          if (t < 1) {
            state.map.flyAnim = requestAnimationFrame(step);
          }
        }
        state.map.flyAnim = requestAnimationFrame(step);
      }

      function updateScaleBarUI() {
        const mpp = getMetersPerPixel();
        const barPx = 64; // w-16
        const distMeters = mpp * barPx;
        const scaleDenom = Math.round(mpp * 3779.5); // 96 DPI 近似比例尺分母

        const distLabel =
          distMeters >= 1000
            ? `${(distMeters / 1000).toFixed(1)} km`
            : `${Math.round(distMeters)} m`;

        document.getElementById('status-scale').textContent =
          `1 : ${scaleDenom.toLocaleString()} (${distLabel})`;
      }

      /**
       * =========================================================================
       * UI 渲染与布局模式切换 (Docked / Overlay / Theme / Language)
       * =========================================================================
       */
      function setLayoutMode(mode) {
        state.layout = mode;
        document.body.setAttribute('data-layout', mode);

        const btnDocked = document.getElementById('btn-layout-docked');
        const btnOverlay = document.getElementById('btn-layout-overlay');

        const activeClasses = [
          'bg-white',
          'dark:bg-slate-700',
          'text-blue-600',
          'dark:text-blue-400',
          'shadow-sm',
        ];
        const inactiveClasses = ['text-slate-500', 'dark:text-slate-400'];

        if (mode === 'docked') {
          btnDocked.classList.add(...activeClasses);
          btnDocked.classList.remove(...inactiveClasses);
          btnOverlay.classList.remove(...activeClasses);
          btnOverlay.classList.add(...inactiveClasses);
          document.getElementById('map-zoom-controls').style.bottom = '16px';
          document.getElementById('map-zoom-controls').style.right = '16px';
        } else {
          btnOverlay.classList.add(...activeClasses);
          btnOverlay.classList.remove(...inactiveClasses);
          btnDocked.classList.remove(...activeClasses);
          btnDocked.classList.add(...inactiveClasses);
          // Overlay 模式下避开底部悬浮状态栏和右侧悬浮面板
          document.getElementById('map-zoom-controls').style.bottom = '56px';
          document.getElementById('map-zoom-controls').style.right = state.rightCollapsed
            ? '16px'
            : '316px';
        }

        // 布局变更后重新计算画布尺寸
        setTimeout(resizeCanvas, 360);
      }

      function toggleSidebar(side) {
        if (side === 'left') {
          state.leftCollapsed = !state.leftCollapsed;
          document.body.classList.toggle('left-collapsed', state.leftCollapsed);
          document
            .getElementById('btn-expand-left')
            .classList.toggle('hidden', !state.leftCollapsed);
        } else {
          state.rightCollapsed = !state.rightCollapsed;
          document.body.classList.toggle('right-collapsed', state.rightCollapsed);
          document
            .getElementById('btn-expand-right')
            .classList.toggle('hidden', !state.rightCollapsed);
          if (state.layout === 'overlay') {
            document.getElementById('map-zoom-controls').style.right = state.rightCollapsed
              ? '16px'
              : '316px';
          }
        }
        setTimeout(resizeCanvas, 360);
      }

      function toggleTheme() {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.classList.toggle('dark', state.theme === 'dark');
        renderMap();
      }

      function toggleLanguage() {
        state.lang = state.lang === 'zh' ? 'en' : 'zh';
        applyI18n();
        renderLayersAndLegend();
        renderAttributePanel();
        renderMap();
      }

      function applyI18n() {
        const dict = I18N[state.lang];
        document.getElementById('app-title').textContent = dict.appTitle;

        document.querySelectorAll('[data-i18n]').forEach((el) => {
          const key = el.getAttribute('data-i18n');
          if (dict[key]) el.textContent = dict[key];
        });

        document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
          const key = el.getAttribute('data-i18n-placeholder');
          if (dict[key]) el.placeholder = dict[key];
        });
      }

      // 渲染左侧图层管理 + 动态图例
      function renderLayersAndLegend() {
        const dict = I18N[state.lang];
        const layerContainer = document.getElementById('layer-list-container');
        const legendContainer = document.getElementById('legend-items-container');

        layerContainer.innerHTML = layers
          .map((layer) => {
            const count =
              layer.id === 'grid' || layer.id === 'heatmap'
                ? ''
                : `<span class="text-[10px] font-mono text-slate-400">(${features.filter((f) => f.layerId === layer.id).length})</span>`;

            return `
          <div class="p-2.5 rounded-xl bg-slate-50/90 dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-700/70 transition-all hover:border-blue-500/40">

              <label class="flex items-center gap-2 cursor-pointer flex-1 min-w-0">
                <input type="checkbox" ${layer.visible ? 'checked' : ''} onchange="toggleLayerVisibility('${layer.id}', this.checked)"
                  class="w-3.5 h-3.5 rounded accent-blue-600 cursor-pointer" />
                <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${layer.color}"></span>
                <span class="text-xs font-medium truncate text-slate-700 dark:text-slate-200">${dict[layer.i18nKey]}</span>
              </label>
              ${count}
            </div>
            <div class="mt-2 flex items-center gap-2 pl-5">
              <i data-lucide="sun-dim" class="w-3 h-3 text-slate-400 shrink-0"></i>

                oninput="updateLayerOpacity('${layer.id}', this.value)"

              <span class="text-[10px] font-mono text-slate-400 w-7 text-right">${Math.round(layer.opacity * 100)}%</span>
            </div>
          </div>
        `;
          })
          .join('');

        // 动态生成当前激活图层的图例
        const activeLayers = layers.filter((l) => l.visible);
        document.getElementById('active-legend-count').textContent =
          `${activeLayers.length} ACTIVE`;

        legendContainer.innerHTML = activeLayers
          .map((layer) => {
            const itemsHtml = layer.legendItems
              .map((item) => {
                const text = state.lang === 'zh' ? item.labelZh : item.labelEn;
                if (item.gradient) {
                  return `
              <div class="space-y-1">
                <div class="h-2 w-full rounded-full" style="background: ${item.gradient}"></div>
                <div class="text-[11px] text-slate-500 dark:text-slate-400">${text}</div>
              </div>
            `;
                }
                if (item.dotColor) {
                  return `
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full border border-white/40 shrink-0" style="background: ${item.dotColor}"></span>
                <span class="text-[11px] text-slate-600 dark:text-slate-300">${text}</span>
              </div>
            `;
                }
                if (item.lineColor) {
                  return `
              <div class="flex items-center gap-2">
                <span class="w-5 h-0 border-t-2 ${item.dashed ? 'border-dashed' : ''} shrink-0" style="border-color: ${item.lineColor}"></span>
                <span class="text-[11px] text-slate-600 dark:text-slate-300">${text}</span>
              </div>
            `;
                }
                return `
            <div class="flex items-center gap-2">
              <span class="w-3.5 h-3 rounded-sm border shrink-0" style="background: ${item.color}; border-color: ${item.border}"></span>
              <span class="text-[11px] text-slate-600 dark:text-slate-300">${text}</span>
            </div>
          `;
              })
              .join('');

            return `<div class="space-y-1.5 pb-2 border-b border-slate-200/60 dark:border-slate-800/80 last:border-none">${itemsHtml}</div>`;
          })
          .join('');

        lucide.createIcons();
      }

      function toggleLayerVisibility(layerId, visible) {
        const layer = layers.find((l) => l.id === layerId);
        if (layer) {
          layer.visible = visible;
          renderLayersAndLegend();
          renderMap();
        }
      }

      function updateLayerOpacity(layerId, val) {
        const layer = layers.find((l) => l.id === layerId);
        if (layer) {
          layer.opacity = Number(val) / 100;
          renderLayersAndLegend();
          renderMap();
        }
      }

        </form>
      `;
        lucide.createIcons();
      }

      function saveFeatureAttributes(e) {
        e.preventDefault();
        const f = features.find((item) => item.id === state.selectedFeatureId);
        if (!f) return;

        const newName = document.getElementById('attr-input-name').value.trim();
        if (newName) {
          if (state.lang === 'zh') f.name = newName;
          else f.nameEn = newName;
        }
        f.category = document.getElementById('attr-input-cat').value.trim();
        f.status = document.getElementById('attr-input-status').value;
        f.baseValue = parseFloat(document.getElementById('attr-input-val').value) || 0;
        f.notes = document.getElementById('attr-input-notes').value.trim();

        renderAttributePanel();
        renderMap();
        showToast(I18N[state.lang].toastSaved);
      }

      function deleteSelectedFeature() {
        features = features.filter((f) => f.id !== state.selectedFeatureId);
        state.selectedFeatureId = null;
        renderLayersAndLegend();
        renderAttributePanel();
        renderMap();
        showToast(I18N[state.lang].toastDeleted);
      }

      function flyToSelectedFeature() {
        const f = features.find((item) => item.id === state.selectedFeatureId);
        if (!f) return;
        const center = getFeatureCenter(f);
        flyToLocation(center[0], center[1], 14.8);
      }

      /**
       * =========================================================================
       * 工具切换、搜索定位与时间选择器交互
       * =========================================================================
       */
      function setActiveTool(tool) {
        state.activeTool = tool;
        state.tempVertices = [];

        document.querySelectorAll('.tool-btn').forEach((btn) => {
          btn.classList.remove('bg-blue-600', 'text-white', 'shadow-sm');
          btn.classList.add('text-slate-600', 'dark:text-slate-300');
        });

        const activeBtn = document.getElementById(`tool-${tool}`);
        if (activeBtn) {
          activeBtn.classList.add('bg-blue-600', 'text-white', 'shadow-sm');
          activeBtn.classList.remove('text-slate-600', 'dark:text-slate-300');
        }

        const banner = document.getElementById('tool-hint-banner');
        const hintText = document.getElementById('tool-hint-text');
        const dict = I18N[state.lang];

        if (tool === 'pan') {
          banner.classList.add('hidden');
        } else {
          banner.classList.remove('hidden');
          const mapHints = {
            point: dict.hintPoint,
            line: dict.hintLine,
            polygon: dict.hintPolygon,
            measure: dict.hintMeasure,
          };
          hintText.textContent = mapHints[tool] || '';
        }

        renderMap();
      }

      function clearMeasurementsAndTemp() {
        state.tempVertices = [];
        state.measurements = [];
        document.getElementById('measure-result-card').classList.add('hidden');
        setActiveTool('pan');
        renderMap();
        showToast(I18N[state.lang].toastCleared);
      }

      function handleTimeChange(val) {
        state.timeSlot = val;
        renderAttributePanel();
        renderMap();
      }

      function handleSearchInput(keyword) {
        const dropdown = document.getElementById('search-results-dropdown');
        const q = keyword.trim().toLowerCase();

        const matched = features.filter(
          (f) =>
            f.name.toLowerCase().includes(q) ||
            (f.nameEn && f.nameEn.toLowerCase().includes(q)) ||
            f.id.toLowerCase().includes(q) ||
            f.category.toLowerCase().includes(q)
        );

        if (matched.length === 0) {
          dropdown.classList.add('hidden');
          return;
        }

        dropdown.classList.remove('hidden');
        dropdown.innerHTML = matched
          .map((f) => {
            const title = state.lang === 'zh' ? f.name : f.nameEn || f.name;
            return `
          <button type="button" onclick="selectSearchResult('${f.id}')"
            class="w-full px-3 py-2 text-left hover:bg-slate-100 dark:hover:bg-slate-700/80 flex items-center justify-between gap-2 transition-colors">
            <div class="min-w-0">
              <div class="text-xs font-medium text-slate-800 dark:text-slate-100 truncate">${title}</div>
              <div class="text-[10px] text-slate-400 truncate">${f.category}</div>
            </div>
            <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-blue-500/10 text-blue-500 shrink-0">${f.id}</span>
          </button>
        `;
          })
          .join('');
      }

      function selectSearchResult(featureId) {
        document.getElementById('search-results-dropdown').classList.add('hidden');
        const f = features.find((item) => item.id === featureId);
        if (!f) return;

        state.selectedFeatureId = f.id;
        if (state.rightCollapsed) toggleSidebar('right');
        renderAttributePanel();

        const center = getFeatureCenter(f);
        flyToLocation(center[0], center[1], 14.8);
      }

      // 点击外部关闭搜索下拉框
      document.addEventListener('click', (e) => {
        const input = document.getElementById('search-input');
        const dropdown = document.getElementById('search-results-dropdown');
        if (!input.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.classList.add('hidden');
        }
      });

      function showToast(msg) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className =
          'px-3.5 py-2 rounded-xl bg-slate-900/95 text-white text-xs font-medium shadow-xl border border-slate-700/80 backdrop-blur flex items-center gap-2 transition-all duration-300';
        toast.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span><span>${msg}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(8px)';
          setTimeout(() => toast.remove(), 300);
        }, 2600);
      }

      /**
       * =========================================================================
       * 系统初始化启动入口
       * =========================================================================
       */
      window.addEventListener('resize', resizeCanvas);

      window.onload = function () {
        lucide.createIcons();
        applyI18n();
        renderLayersAndLegend();
        renderAttributePanel();
        resizeCanvas();
      };
    </script>
  </body>
</html>
