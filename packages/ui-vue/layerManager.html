<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenLayers 图层管理面板 - WebGIS 控件演示</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- OpenLayers 10.x CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.3.1/ol.css" />
  <script src="https://cdn.jsdelivr.net/npm/ol@v10.3.1/dist/ol.js"></script>
  <!-- Inter & Noto Sans SC 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       1. 双主题 CSS 变量定义 (Smoked Frosted Glass 高对比度 WebGIS 规范)
       ========================================================================== */
    :root {
      --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      --transition-fast: 160ms cubic-bezier(0.2, 0, 0, 1);
      --transition-smooth: 260ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 深空烟熏磨砂玻璃主题 (Dark) */
    html[data-theme="dark"] {
      --panel-bg: rgba(15, 23, 42, 0.78);
      --panel-header-bg: rgba(15, 23, 42, 0.88);
      --card-bg: rgba(30, 41, 59, 0.56);
      --card-bg-hover: rgba(30, 41, 59, 0.85);
      --card-bg-expanded: rgba(15, 23, 42, 0.68);
      --border-outer: rgba(148, 163, 184, 0.24);
      --border-inner: rgba(148, 163, 184, 0.14);
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.22);
      --slider-track: rgba(148, 163, 184, 0.22);
      --slider-fill: #38bdf8;
      --slider-thumb: #f8fafc;
      --shadow-panel: 0 20px 45px -10px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
      --btn-hover-bg: rgba(148, 163, 184, 0.16);
      --drag-over-border: #38bdf8;
      --badge-bg: rgba(56, 189, 248, 0.14);
      --badge-text: #7dd3fc;
    }

    /* 浅灰高对比度磨砂玻璃主题 (Light) */
    html[data-theme="light"] {
      --panel-bg: rgba(248, 250, 252, 0.82);
      --panel-header-bg: rgba(255, 255, 255, 0.90);
      --card-bg: rgba(255, 255, 255, 0.72);
      --card-bg-hover: rgba(255, 255, 255, 0.95);
      --card-bg-expanded: rgba(241, 245, 249, 0.85);
      --border-outer: rgba(15, 23, 42, 0.14);
      --border-inner: rgba(15, 23, 42, 0.09);
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #94a3b8;
      --accent-color: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.16);
      --slider-track: rgba(15, 23, 42, 0.14);
      --slider-fill: #0284c7;
      --slider-thumb: #ffffff;
      --shadow-panel: 0 18px 40px -10px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(255, 255, 255, 0.7) inset;
      --btn-hover-bg: rgba(15, 23, 42, 0.07);
      --drag-over-border: #0284c7;
      --badge-bg: rgba(2, 132, 199, 0.10);
      --badge-text: #0369a1;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      background-color: #0b1120;
    }

    /* 地图容器 */
    #map {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Dark 模式下对浅色底图瓦片施加暗色空间滤镜，保持 WebGIS 视觉沉浸感 */
    html[data-theme="dark"] .ol-layer-basemap-canvas canvas {
      filter: invert(92%) hue-rotate(180deg) brightness(92%) contrast(94%) saturate(85%);
      transition: filter 0.35s ease;
    }
    html[data-theme="light"] .ol-layer-basemap-canvas canvas {
      filter: none;
      transition: filter 0.35s ease;
    }

    /* 隐藏默认 OpenLayers 缩放按钮以保持画布整洁，保留比例尺与归属 */
    .ol-zoom {
      display: none;
    }
    .ol-attribution {
      background: var(--panel-bg) !important;
      backdrop-filter: blur(12px);
      border-radius: 8px 0 0 0;
      padding: 2px 6px !important;
      font-size: 11px;
    }
    .ol-attribution ul {
      color: var(--text-secondary) !important;
    }
    .ol-attribution a {
      color: var(--accent-color) !important;
    }

    /* ==========================================================================
       2. 图层管理主面板样式
       ========================================================================== */
    .layer-manager-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 344px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid var(--border-outer);
      border-radius: 14px;
      box-shadow: var(--shadow-panel);
      color: var(--text-primary);
      z-index: 1000;
      transition: background var(--transition-smooth), border-color var(--transition-smooth), box-shadow var(--transition-smooth);
    }

    /* 顶部标题栏 */
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 14px;
      background: var(--panel-header-bg);
      border-bottom: 1px solid var(--border-outer);
      border-radius: 14px 14px 0 0;
      flex-shrink: 0;
    }

    .panel-title-group {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 600;
      font-size: 14.5px;
      letter-spacing: 0.01em;
    }

    .panel-title-icon {
      color: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .layer-count-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-variant-numeric: tabular-nums;
    }

    /* 搜索过滤栏 */
    .panel-search-bar {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-inner);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-inner);
      border-radius: 8px;
      padding: 6px 28px 6px 30px;
      font-size: 12.5px;
      color: var(--text-primary);
      outline: none;
      user-select: text;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    /* 通用图标按钮 */
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background var(--transition-fast), color var(--transition-fast), transform 100ms ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: var(--btn-hover-bg);
      color: var(--text-primary);
    }

    .icon-btn:active {
      transform: scale(0.93);
    }

    .icon-btn.active-eye {
      color: var(--accent-color);
    }

    .icon-btn.off-eye {
      color: var(--text-muted);
    }

    /* 图层卡片列表容器 */
    .layer-list-container {
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    /* 自定义滚动条 */
    .layer-list-container::-webkit-scrollbar {
      width: 5px;
    }
    .layer-list-container::-webkit-scrollbar-track {
      background: transparent;
    }
    .layer-list-container::-webkit-scrollbar-thumb {
      background: var(--border-outer);
      border-radius: 99px;
    }

    /* ==========================================================================
       3. 图层卡片（收起与展开状态）
       ========================================================================== */
    .layer-card {
      background: var(--card-bg);
      border: 1px solid var(--border-inner);
      border-radius: 10px;
      transition: background var(--transition-fast), border-color var(--transition-fast), opacity var(--transition-fast), transform var(--transition-fast);
      overflow: hidden;
    }

    .layer-card:hover {
      background: var(--card-bg-hover);
      border-color: var(--border-outer);
    }

    .layer-card.is-expanded {
      background: var(--card-bg-expanded);
      border-color: var(--border-outer);
    }

    /* 拖拽状态反馈 */
    .layer-card.is-dragging {
      opacity: 0.45;
      transform: scale(0.985);
    }

    .layer-card.drag-over-top {
      border-top: 2px solid var(--drag-over-border);
    }

    .layer-card.drag-over-bottom {
      border-bottom: 2px solid var(--drag-over-border);
    }

    /* 卡片顶部主行：[eye icon] [图层title]      [drag icon][flyTo icon][展开/收起icon] */
    .layer-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 8px;
      min-height: 42px;
      gap: 6px;
    }

    .layer-left-group {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .layer-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }

    .layer-color-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.12);
    }

    .layer-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color var(--transition-fast), opacity var(--transition-fast);
    }

    /* 图层隐藏时的弱化态 */
    .layer-card.is-hidden .layer-title,
    .layer-card.is-hidden .layer-color-dot {
      opacity: 0.45;
    }

    .layer-right-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .drag-handle {
      cursor: grab;
      color: var(--text-muted);
    }
    .drag-handle:hover {
      color: var(--text-primary);
    }
    .drag-handle:active {
      cursor: grabbing;
    }

    .chevron-icon {
      transition: transform var(--transition-smooth);
    }
    .layer-card.is-expanded .chevron-icon {
      transform: rotate(180deg);
    }

    /* ==========================================================================
       4. 展开抽屉区域（透明度进度条 + 子图层树）
       ========================================================================== */
    .layer-drawer {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows var(--transition-smooth);
    }

    .layer-card.is-expanded .layer-drawer {
      grid-template-rows: 1fr;
    }

    .layer-drawer-inner {
      overflow: hidden;
    }

    .layer-drawer-content {
      padding: 8px 12px 12px 12px;
      border-top: 1px solid var(--border-inner);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 透明度控制行：[opacity icon] [可拖拽的进度条] [百分比] */
    .opacity-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 2px 0;
    }

    .opacity-icon {
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    /* 自定义高交互进度条滑块 */
    .custom-slider {
      position: relative;
      flex: 1;
      height: 20px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }

    .custom-slider-track {
      position: relative;
      width: 100%;
      height: 5px;
      background: var(--slider-track);
      border-radius: 999px;
      overflow: hidden;
    }

    .custom-slider-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: var(--slider-fill);
      border-radius: 999px;
      pointer-events: none;
    }

    .custom-slider-thumb {
      position: absolute;
      top: 50%;
      width: 14px;
      height: 14px;
      background: var(--slider-thumb);
      border: 2.5px solid var(--slider-fill);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      transition: transform 100ms ease, box-shadow 120ms ease;
    }

    .custom-slider:hover .custom-slider-thumb,
    .custom-slider.is-dragging .custom-slider-thumb {
      transform: translate(-50%, -50%) scale(1.18);
      box-shadow: 0 0 0 4px var(--accent-glow), 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .opacity-value {
      width: 38px;
      text-align: right;
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    /* 子图层列表（缩进树结构） */
    .sublayers-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-left: 14px;
      margin-left: 6px;
      border-left: 1.5px solid var(--border-outer);
    }

    .sublayer-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 6px;
      border-radius: 7px;
      transition: background var(--transition-fast);
    }

    .sublayer-item:hover {
      background: var(--btn-hover-bg);
    }

    .sublayer-title {
      font-size: 12.5px;
      color: var(--text-secondary);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: opacity var(--transition-fast), color var(--transition-fast);
    }

    .sublayer-item.is-hidden .sublayer-title,
    .sublayer-item.is-hidden .sublayer-swatch {
      opacity: 0.45;
    }

    .sublayer-swatch {
      width: 10px;
      height: 3px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* 底部状态栏 / 快捷操作 */
    .panel-footer {
      padding: 8px 14px;
      border-top: 1px solid var(--border-inner);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* Toast 提示气泡 */
    .toast-notice {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--panel-header-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-outer);
      color: var(--text-primary);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      box-shadow: var(--shadow-panel);
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease, transform 220ms cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast-notice.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 左侧地图信息悬浮徽章 */
    .map-hud-badge {
      position: fixed;
      top: 16px;
      left: 16px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-outer);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text-primary);
      box-shadow: var(--shadow-panel);
      z-index: 900;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: calc(100vw - 380px);
    }

    @media (max-width: 720px) {
      .map-hud-badge {
        display: none;
      }
      .layer-manager-panel {
        width: calc(100vw - 24px);
        right: 12px;
        top: 12px;
        max-height: 62vh;
      }
    }
  </style>
</head>
<body>

  <!-- 交互式 OpenLayers 地图画布 -->
  <div id="map"></div>

  <!-- 左侧 WebGIS 状态信息悬浮卡片 -->
  <div class="map-hud-badge">
    <div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;">
      <span style="width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981;"></span>
      <span>城市空间数据引擎 · OpenLayers 10</span>
    </div>
    <div id="coord-readout" style="font-size:11.5px;color:var(--text-secondary);font-variant-numeric:tabular-nums;">
      中心坐标: 116.3974° E, 39.9093° N · 层级: 12.5
    </div>
  </div>

  <!-- 核心组件：图层管理面板 -->
  <aside class="layer-manager-panel" aria-label="图层管理面板">
    <!-- 顶部标题栏：[icon] 图层管理 + 主题切换 -->
    <header class="panel-header">
      <div class="panel-title-group">
        <span class="panel-title-icon" aria-hidden="true">
          <!-- Layers SVG -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </span>
        <span>图层管理</span>
        <span class="layer-count-badge" id="visible-count-badge">4/4</span>
      </div>

      <div style="display:flex;align-items:center;gap:4px;">
        <!-- 全部重置视角 -->
        <button id="btn-reset-view" class="icon-btn" title="定位至全局范围">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>
        <!-- Dark / Light 主题切换按钮 -->
        <button id="btn-theme-toggle" class="icon-btn" title="切换深色 / 浅色主题" aria-label="切换主题">
          <!-- 图标由 JS 动态渲染 -->
        </button>
      </div>
    </header>

    <!-- 紧凑搜索过滤栏 -->
    <div class="panel-search-bar">
      <div class="search-input-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:9px;color:var(--text-muted);pointer-events:none;">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="layer-search-input" type="text" class="search-input" placeholder="过滤图层或子图层名称..." />
        <button id="btn-clear-search" class="icon-btn" style="position:absolute;right:2px;width:22px;height:22px;display:none;" title="清空搜索">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- 图层卡片动态列表 -->
    <div id="layer-list" class="layer-list-container" role="list"></div>

    <!-- 底部提示栏 -->
    <footer class="panel-footer">
      <span>拖拽手柄调整渲染层级 (zIndex)</span>
      <span id="theme-label">Dark 烟熏玻璃</span>
    </footer>
  </aside>

  <!-- 操作反馈 Toast -->
  <div id="toast" class="toast-notice" role="status" aria-live="polite"></div>

  <script>
    /**
     * ==========================================================================
     * OpenLayers 图层管理面板完整应用逻辑
     * ==========================================================================
     */
    (function () {
      'use strict';

      // ------------------------------------------------------------------------
      // 1. Crisp SVG 图标库 (Lucide 风格，1.85px 统一描边)
      // ------------------------------------------------------------------------
      const ICONS = {
        eye: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>`,
        eyeOff: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                   <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>
                   <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>
                   <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>
                   <path d="m2 2 20 20"/>
                 </svg>`,
        drag: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                 <circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/>
                 <circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/>
               </svg>`,
        flyTo: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>
                  <line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/>
                  <circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/>
                </svg>`,
        chevronDown: `<svg class="chevron-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                      </svg>`,
        opacity: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                  </svg>`,
        sun: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
                <path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
              </svg>`,
        moon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                 <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
               </svg>`
      };

      // ------------------------------------------------------------------------
      // 2. 初始化 OpenLayers 业务矢量数据与图层
      // ------------------------------------------------------------------------
      const CENTER_LONLAT = [116.3974, 39.9093]; // 北京核心区基准坐标
      const INITIAL_CENTER = ol.proj.fromLonLat(CENTER_LONLAT);

      // 工具函数：创建线段 Feature
      function createLineFeature(coordsLonLat, name) {
        return new ol.Feature({
          geometry: new ol.geom.LineString(coordsLonLat.map(c => ol.proj.fromLonLat(c))),
          name
        });
      }

      // 工具函数：创建多边形 Feature
      function createPolygonFeature(ringLonLat, name) {
        return new ol.Feature({
          geometry: new ol.geom.Polygon([ringLonLat.map(c => ol.proj.fromLonLat(c))]),
          name
        });
      }

      // 工具函数：创建点位 Feature
      function createPointFeature(lonLat, name, value) {
        return new ol.Feature({
          geometry: new ol.geom.Point(ol.proj.fromLonLat(lonLat)),
          name,
          value
        });
      }

      // [图层组 1 子图层 A] 城市主干道矢量图层
      const primaryRoadsSource = new ol.source.Vector({
        features: [
          createLineFeature([[116.320, 39.907], [116.397, 39.909], [116.480, 39.911]], '长安街主干道'),
          createLineFeature([[116.397, 39.855], [116.397, 39.909], [116.397, 39.965]], '中轴线主干道'),
          createLineFeature([[116.352, 39.875], [116.352, 39.945], [116.438, 39.945], [116.438, 39.875], [116.352, 39.875]], '二环快速路')
        ]
      });
      const primaryRoadsLayer = new ol.layer.Vector({
        source: primaryRoadsSource,
        style: new ol.style.Style({
          stroke: new ol.style.Stroke({ color: '#f59e0b', width: 4.5, lineCap: 'round' })
        })
      });

      // [图层组 1 子图层 B] 城市次干道与支路矢量图层
      const secondaryRoadsSource = new ol.source.Vector({
        features: [
          createLineFeature([[116.365, 39.928], [116.425, 39.928]], '平安大街次干道'),
          createLineFeature([[116.365, 39.892], [116.425, 39.892]], '两广路次干道'),
          createLineFeature([[116.375, 39.882], [116.375, 39.938]], '西单北大街'),
          createLineFeature([[116.416, 39.882], [116.416, 39.938]], '东单北大街')
        ]
      });
      const secondaryRoadsLayer = new ol.layer.Vector({
        source: secondaryRoadsSource,
        style: new ol.style.Style({
          stroke: new ol.style.Stroke({ color: '#38bdf8', width: 2.5, lineDash: [6, 4] })
        })
      });

      // [业务图层组 1] 城市核心区路网矢量组 (LayerGroup)
      const roadNetworkGroup = new ol.layer.Group({
        layers: [secondaryRoadsLayer, primaryRoadsLayer],
        visible: true,
        opacity: 0.95
      });

      // [业务图层 2] 物联网环境监测点位图层
      const iotPointsData = [
        { coord: [116.397, 39.909], name: '天安门广场站', val: 98 },
        { coord: [116.416, 39.914], name: '王府井监测站', val: 92 },
        { coord: [116.374, 39.911], name: '西单商业区站', val: 89 },
        { coord: [116.455, 39.912], name: 'CBD国贸节点', val: 95 },
        { coord: [116.358, 39.936], name: '西直门枢纽站', val: 84 },
        { coord: [116.432, 39.941], name: '东直门枢纽站', val: 91 },
        { coord: [116.395, 39.881], name: '天坛公园生态站', val: 99 }
      ];
      const iotSource = new ol.source.Vector({
        features: iotPointsData.map(d => createPointFeature(d.coord, d.name, d.val))
      });
      const iotLayer = new ol.layer.Vector({
        source: iotSource,
        visible: true,
        opacity: 1.0,
        style: function (feature) {
          return [
            new ol.style.Style({
              image: new ol.style.Circle({
                radius: 11,
                fill: new ol.style.Fill({ color: 'rgba(16, 185, 129, 0.24)' })
              })
            }),
            new ol.style.Style({
              image: new ol.style.Circle({
                radius: 5.5,
                fill: new ol.style.Fill({ color: '#10b981' }),
                stroke: new ol.style.Stroke({ color: '#ffffff', width: 1.8 })
              }),
              text: new ol.style.Text({
                text: feature.get('name'),
                offsetY: -16,
                font: '500 11px Inter, "Noto Sans SC", sans-serif',
                fill: new ol.style.Fill({ color: '#f8fafc' }),
                backgroundFill: new ol.style.Fill({ color: 'rgba(15, 23, 42, 0.78)' }),
                padding: [2, 5, 2, 5]
              })
            })
          ];
        }
      });

      // [业务图层组 2] 重点功能区规划边界组 (LayerGroup)
      const coreZoneLayer = new ol.layer.Vector({
        source: new ol.source.Vector({
          features: [
            createPolygonFeature([
              [116.382, 39.902], [116.412, 39.902], [116.412, 39.926], [116.382, 39.926], [116.382, 39.902]
            ], '核心政务文化区')
          ]
        }),
        style: new ol.style.Style({
          fill: new ol.style.Fill({ color: 'rgba(168, 85, 247, 0.22)' }),
          stroke: new ol.style.Stroke({ color: '#a855f7', width: 2.2 })
        })
      });

      const cbdZoneLayer = new ol.layer.Vector({
        source: new ol.source.Vector({
          features: [
            createPolygonFeature([
              [116.442, 39.900], [116.472, 39.900], [116.472, 39.924], [116.442, 39.924], [116.442, 39.900]
            ], '东部商务中心区')
          ]
        }),
        style: new ol.style.Style({
          fill: new ol.style.Fill({ color: 'rgba(236, 72, 153, 0.20)' }),
          stroke: new ol.style.Stroke({ color: '#ec4899', width: 2.2, lineDash: [5, 5] })
        })
      });

      const districtGroup = new ol.layer.Group({
        layers: [coreZoneLayer, cbdZoneLayer],
        visible: true,
        opacity: 0.85
      });

      // [底图图层 4] 电子矢量地图底图 (OSM)
      const baseMapLayer = new ol.layer.Tile({
        source: new ol.source.OSM(),
        visible: true,
        opacity: 1.0,
        className: 'ol-layer-basemap-canvas'
      });

      // 初始化 OpenLayers Map 实例
      const map = new ol.Map({
        target: 'map',
        layers: [baseMapLayer, districtGroup, roadNetworkGroup, iotLayer],
        view: new ol.View({
          center: INITIAL_CENTER,
          zoom: 12.6,
          minZoom: 3,
          maxZoom: 19
        })
      });

      // 实时更新左上角坐标与缩放层级读数
      function updateMapHud() {
        const view = map.getView();
        const center = ol.proj.toLonLat(view.getCenter());
        const zoom = view.getZoom().toFixed(1);
        document.getElementById('coord-readout').textContent =
          `中心坐标: ${center[0].toFixed(4)}° E, ${center[1].toFixed(4)}° N · 层级: ${zoom}`;
      }
      map.on('moveend', updateMapHud);
      updateMapHud();

      // ------------------------------------------------------------------------
      // 3. 图层面板状态模型（数组顺序即面板从上到下顺序，索引0拥有最高 zIndex）
      // ------------------------------------------------------------------------
      const layerState = [
        {
          id: 'iot-sensors',
          title: '物联网环境监测点位',
          color: '#10b981',
          visible: true,
          opacity: 1.0,
          expanded: false,
          olLayer: iotLayer,
          extent: iotSource.getExtent()
        },
        {
          id: 'road-network',
          title: '城市核心区路网矢量',
          color: '#f59e0b',
          visible: true,
          opacity: 0.95,
          expanded: true, // 默认展开一个组图层以直观展示线框结构
          olLayer: roadNetworkGroup,
          extent: ol.extent.extend(primaryRoadsSource.getExtent().slice(), secondaryRoadsSource.getExtent()),
          children: [
            {
              id: 'primary-roads',
              title: '城市主干道与环线',
              color: '#f59e0b',
              visible: true,
              olLayer: primaryRoadsLayer
            },
            {
              id: 'secondary-roads',
              title: '次干道及支路网格',
              color: '#38bdf8',
              visible: true,
              olLayer: secondaryRoadsLayer
            }
          ]
        },
        {
          id: 'district-zones',
          title: '重点功能区规划边界',
          color: '#a855f7',
          visible: true,
          opacity: 0.85,
          expanded: false,
          olLayer: districtGroup,
          extent: ol.extent.extend(
            coreZoneLayer.getSource().getExtent().slice(),
            cbdZoneLayer.getSource().getExtent()
          ),
          children: [
            {
              id: 'core-zone',
              title: '核心政务文化区',
              color: '#a855f7',
              visible: true,
              olLayer: coreZoneLayer
            },
            {
              id: 'cbd-zone',
              title: '东部商务中心区 (CBD)',
              color: '#ec4899',
              visible: true,
              olLayer: cbdZoneLayer
            }
          ]
        },
        {
          id: 'basemap-osm',
          title: '基础地理空间底图',
          color: '#64748b',
          visible: true,
          opacity: 1.0,
          expanded: false,
          olLayer: baseMapLayer,
          extent: ol.proj.transformExtent([116.25, 39.82, 116.55, 40.00], 'EPSG:4326', 'EPSG:3857')
        }
      ];

      // 同步所有图层的 OpenLayers zIndex（面板最顶部对应最高渲染层级）
      function syncLayerZIndices() {
        const total = layerState.length;
        layerState.forEach((item, index) => {
          const zIndex = (total - index) * 10;
          item.olLayer.setZIndex(zIndex);
        });
      }
      syncLayerZIndices();

      // ------------------------------------------------------------------------
      // 4. Toast 通知提示工具
      // ------------------------------------------------------------------------
      let toastTimer = null;
      function showToast(message) {
        const toastEl = document.getElementById('toast');
        toastEl.innerHTML = `<span style="width:6px;height:6px;border-radius:50%;background:var(--accent-color);"></span><span>${message}</span>`;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastEl.classList.remove('show');
        }, 2000);
      }

      // ------------------------------------------------------------------------
      // 5. 核心渲染与交互绑定
      // ------------------------------------------------------------------------
      const layerListEl = document.getElementById('layer-list');
      const visibleCountBadge = document.getElementById('visible-count-badge');
      let searchKeyword = '';
      let draggedIndex = null;

      function updateVisibleBadge() {
        const visibleCount = layerState.filter(l => l.visible).length;
        visibleCountBadge.textContent = `${visibleCount}/${layerState.length}`;
      }

      function renderLayerList() {
        updateVisibleBadge();
        layerListEl.innerHTML = '';

        const kw = searchKeyword.trim().toLowerCase();

        layerState.forEach((item, index) => {
          // 搜索过滤逻辑
          const matchParent = item.title.toLowerCase().includes(kw);
          const matchingChildren = item.children
            ? item.children.filter(c => c.title.toLowerCase().includes(kw))
            : [];

          if (kw && !matchParent && matchingChildren.length === 0) {
            return;
          }

          const card = document.createElement('div');
          card.className = `layer-card${item.expanded ? ' is-expanded' : ''}${!item.visible ? ' is-hidden' : ''}`;
          card.dataset.index = index;
          card.setAttribute('role', 'listitem');

          // --- 卡片顶部主行：[eye icon] [图层title]      [drag icon][flyTo icon][展开/收起icon] ---
          const header = document.createElement('div');
          header.className = 'layer-card-header';

          // 左侧：显隐 Eye 按钮 + 图层色标与标题
          const leftGroup = document.createElement('div');
          leftGroup.className = 'layer-left-group';

          const eyeBtn = document.createElement('button');
          eyeBtn.className = `icon-btn ${item.visible ? 'active-eye' : 'off-eye'}`;
          eyeBtn.title = item.visible ? '隐藏图层' : '显示图层';
          eyeBtn.setAttribute('aria-label', `${item.visible ? '隐藏' : '显示'} ${item.title}`);
          eyeBtn.innerHTML = item.visible ? ICONS.eye : ICONS.eyeOff;
          eyeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleLayerVisibility(item);
          });

          const titleWrap = document.createElement('div');
          titleWrap.className = 'layer-title-wrap';
          titleWrap.title = `${item.title}（点击展开/收起详情）`;
          titleWrap.innerHTML = `
            <span class="layer-color-dot" style="background:${item.color};"></span>
            <span class="layer-title">${item.title}</span>
          `;
          titleWrap.addEventListener('click', () => {
            item.expanded = !item.expanded;
            renderLayerList();
          });

          leftGroup.appendChild(eyeBtn);
          leftGroup.appendChild(titleWrap);

          // 右侧：[drag icon][flyTo icon][展开/收起icon]
          const rightActions = document.createElement('div');
          rightActions.className = 'layer-right-actions';

          // 1. 拖拽手柄图标 [drag icon]
          const dragBtn = document.createElement('button');
          dragBtn.className = 'icon-btn drag-handle';
          dragBtn.title = '上下拖拽排序';
          dragBtn.innerHTML = ICONS.drag;
          // 仅在按下拖拽手柄时允许卡片触发 HTML5 拖拽，避免干扰透明度滑块拖拽
          dragBtn.addEventListener('pointerdown', () => {
            card.setAttribute('draggable', 'true');
          });
          dragBtn.addEventListener('pointerup', () => {
            card.removeAttribute('draggable');
          });

          // 2. 定位图标 [flyTo icon]
          const flyToBtn = document.createElement('button');
          flyToBtn.className = 'icon-btn';
          flyToBtn.title = '飞行定位至图层范围';
          flyToBtn.innerHTML = ICONS.flyTo;
          flyToBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            flyToLayerExtent(item);
          });

          // 3. 展开/收起图标 [展开/收起 icon]
          const expandBtn = document.createElement('button');
          expandBtn.className = 'icon-btn';
          expandBtn.title = item.expanded ? '收起图层设置' : '展开图层设置';
          expandBtn.innerHTML = ICONS.chevronDown;
          expandBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            item.expanded = !item.expanded;
            renderLayerList();
          });

          rightActions.appendChild(dragBtn);
          rightActions.appendChild(flyToBtn);
          rightActions.appendChild(expandBtn);

          header.appendChild(leftGroup);
          header.appendChild(rightActions);
          card.appendChild(header);

          // --- 卡片展开抽屉区域 ---
          const drawer = document.createElement('div');
          drawer.className = 'layer-drawer';

          const drawerInner = document.createElement('div');
          drawerInner.className = 'layer-drawer-inner';

          const drawerContent = document.createElement('div');
          drawerContent.className = 'layer-drawer-content';

          // 1) 透明度控制行：[opacity icon] [可拖拽的进度条] [百分比]
          const opacityRow = document.createElement('div');
          opacityRow.className = 'opacity-row';

          const pct = Math.round(item.opacity * 100);
          opacityRow.innerHTML = `
            <span class="opacity-icon" title="图层不透明度">${ICONS.opacity}</span>
            <div class="custom-slider" role="slider" aria-label="${item.title} 不透明度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}">
              <div class="custom-slider-track">
                <div class="custom-slider-fill" style="width: ${pct}%;"></div>
              </div>
              <div class="custom-slider-thumb" style="left: ${pct}%;"></div>
            </div>
            <span class="opacity-value">${pct}%</span>
          `;

          const sliderEl = opacityRow.querySelector('.custom-slider');
          const fillEl = opacityRow.querySelector('.custom-slider-fill');
          const thumbEl = opacityRow.querySelector('.custom-slider-thumb');
          const valEl = opacityRow.querySelector('.opacity-value');

          bindCustomSlider(sliderEl, (ratio) => {
            item.opacity = ratio;
            item.olLayer.setOpacity(ratio);
            const displayPct = Math.round(ratio * 100);
            fillEl.style.width = `${displayPct}%`;
            thumbEl.style.left = `${displayPct}%`;
            valEl.textContent = `${displayPct}%`;
            sliderEl.setAttribute('aria-valuenow', displayPct);
          });

          drawerContent.appendChild(opacityRow);

          // 2) 子图层树列表（若有子图层）
          if (item.children && item.children.length > 0) {
            const subList = document.createElement('div');
            subList.className = 'sublayers-list';

            const childrenToRender = kw && !matchParent ? matchingChildren : item.children;

            childrenToRender.forEach((sub) => {
              const subRow = document.createElement('div');
              subRow.className = `sublayer-item${!sub.visible ? ' is-hidden' : ''}`;

              const subEyeBtn = document.createElement('button');
              subEyeBtn.className = `icon-btn ${sub.visible ? 'active-eye' : 'off-eye'}`;
              subEyeBtn.style.width = '24px';
              subEyeBtn.style.height = '24px';
              subEyeBtn.title = sub.visible ? '隐藏子图层' : '显示子图层';
              subEyeBtn.innerHTML = sub.visible ? ICONS.eye : ICONS.eyeOff;

              const subTitle = document.createElement('span');
              subTitle.className = 'sublayer-title';
              subTitle.textContent = sub.title;

              const subSwatch = document.createElement('span');
              subSwatch.className = 'sublayer-swatch';
              subSwatch.style.background = sub.color;

              const toggleSub = () => {
                sub.visible = !sub.visible;
                sub.olLayer.setVisible(sub.visible);

                // 父级与子图层状态联动：
                // 若存在任意可见子图层，确保父级图层组可见；若全部子图层关闭，父级同步切换为 eye-off
                const anyChildVisible = item.children.some(c => c.visible);
                item.visible = anyChildVisible;
                item.olLayer.setVisible(anyChildVisible);

                renderLayerList();
              };

              subEyeBtn.addEventListener('click', toggleSub);
              subTitle.addEventListener('click', toggleSub);

              subRow.appendChild(subEyeBtn);
              subRow.appendChild(subTitle);
              subRow.appendChild(subSwatch);
              subList.appendChild(subRow);
            });

            drawerContent.appendChild(subList);
          }

          drawerInner.appendChild(drawerContent);
          drawer.appendChild(drawerInner);
          card.appendChild(drawer);

          // --- 绑定卡片拖拽排序事件 ---
          bindCardDragEvents(card, index);

          layerListEl.appendChild(card);
        });

        // 无匹配搜索结果提示
        if (layerListEl.children.length === 0) {
          layerListEl.innerHTML = `
            <div style="text-align:center;padding:24px 12px;color:var(--text-muted);font-size:12.5px;">
              未找到匹配 “${searchKeyword}” 的图层
            </div>
          `;
        }
      }

      // ------------------------------------------------------------------------
      // 6. 交互逻辑实现：显隐切换、飞行定位、自定义滑块拖拽、列表拖拽排序
      // ------------------------------------------------------------------------
      function toggleLayerVisibility(item) {
        const nextVisible = !item.visible;
        item.visible = nextVisible;
        item.olLayer.setVisible(nextVisible);

        // 如果是图层组，切换父级 eye 时同步所有子图层状态
        if (item.children && item.children.length > 0) {
          item.children.forEach(sub => {
            sub.visible = nextVisible;
            sub.olLayer.setVisible(nextVisible);
          });
        }

        renderLayerList();
        showToast(`${nextVisible ? '已显示' : '已隐藏'}：${item.title}`);
      }

      function flyToLayerExtent(item) {
        if (!item.visible) {
          toggleLayerVisibility(item);
        }
        if (item.extent && !ol.extent.isEmpty(item.extent)) {
          map.getView().fit(item.extent, {
            padding: [80, 390, 80, 80], // 右侧预留图层管理面板宽度，确保要素居中可见
            duration: 750,
            maxZoom: 15
          });
          showToast(`已定位至：${item.title}`);
        }
      }

      // Pointer Events 实现流畅的自定义进度条滑块拖拽（兼容鼠标与触摸屏）
      function bindCustomSlider(sliderEl, onChange) {
        const updateFromEvent = (clientX) => {
          const rect = sliderEl.getBoundingClientRect();
          let ratio = (clientX - rect.left) / rect.width;
          ratio = Math.max(0, Math.min(1, ratio));
          onChange(ratio);
        };

        sliderEl.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          e.stopPropagation();
          sliderEl.setPointerCapture(e.pointerId);
          sliderEl.classList.add('is-dragging');
          updateFromEvent(e.clientX);
        });

        sliderEl.addEventListener('pointermove', (e) => {
          if (!sliderEl.classList.contains('is-dragging')) return;
          updateFromEvent(e.clientX);
        });

        const endDrag = (e) => {
          if (!sliderEl.classList.contains('is-dragging')) return;
          sliderEl.classList.remove('is-dragging');
          if (sliderEl.hasPointerCapture(e.pointerId)) {
            sliderEl.releasePointerCapture(e.pointerId);
          }
        };

        sliderEl.addEventListener('pointerup', endDrag);
        sliderEl.addEventListener('pointercancel', endDrag);
      }

      // 卡片上下拖拽排序（同步更新 OpenLayers 图层 zIndex）
      function bindCardDragEvents(card, index) {
        card.addEventListener('dragstart', (e) => {
          draggedIndex = index;
          card.classList.add('is-dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', String(index));
        });

        card.addEventListener('dragend', () => {
          draggedIndex = null;
          card.removeAttribute('draggable');
          document.querySelectorAll('.layer-card').forEach(el => {
            el.classList.remove('is-dragging', 'drag-over-top', 'drag-over-bottom');
          });
        });

        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (draggedIndex === null || draggedIndex === index) return;

          const rect = card.getBoundingClientRect();
          const midY = rect.top + rect.height / 2;
          card.classList.remove('drag-over-top', 'drag-over-bottom');
          if (e.clientY < midY) {
            card.classList.add('drag-over-top');
          } else {
            card.classList.add('drag-over-bottom');
          }
        });

        card.addEventListener('dragleave', () => {
          card.classList.remove('drag-over-top', 'drag-over-bottom');
        });

        card.addEventListener('drop', (e) => {
          e.preventDefault();
          if (draggedIndex === null || draggedIndex === index) return;

          const rect = card.getBoundingClientRect();
          const insertAfter = e.clientY >= rect.top + rect.height / 2;

          const [movedItem] = layerState.splice(draggedIndex, 1);
          let targetIndex = index;
          if (draggedIndex < index) targetIndex--;
          if (insertAfter) targetIndex++;

          layerState.splice(targetIndex, 0, movedItem);
          syncLayerZIndices();
          renderLayerList();
          showToast(`已调整图层层级：${movedItem.title}`);
        });
      }

      // ------------------------------------------------------------------------
      // 7. Dark / Light 主题切换与搜索框事件
      // ------------------------------------------------------------------------
      const htmlEl = document.documentElement;
      const themeToggleBtn = document.getElementById('btn-theme-toggle');
      const themeLabelEl = document.getElementById('theme-label');

      function applyTheme(theme) {
        htmlEl.setAttribute('data-theme', theme);
        const isDark = theme === 'dark';
        // Dark 模式下显示太阳图标提示可切换至浅色；Light 模式下显示月亮图标提示可切换至深色
        themeToggleBtn.innerHTML = isDark ? ICONS.sun : ICONS.moon;
        themeToggleBtn.title = isDark ? '切换至 Light 浅色模式' : '切换至 Dark 深空模式';
        themeLabelEl.textContent = isDark ? 'Dark 烟熏玻璃' : 'Light 霜白玻璃';
        // 触发 OpenLayers 重新渲染以应用底图滤镜过渡
        map.render();
      }

      themeToggleBtn.addEventListener('click', () => {
        const current = htmlEl.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        showToast(`已切换至 ${next === 'dark' ? 'Dark 深空模式' : 'Light 浅色模式'}`);
      });

      // 全局视角重置按钮
      document.getElementById('btn-reset-view').addEventListener('click', () => {
        map.getView().animate({
          center: INITIAL_CENTER,
          zoom: 12.6,
          duration: 650
        });
        showToast('已重置地图全局视角');
      });

      // 搜索框过滤交互
      const searchInput = document.getElementById('layer-search-input');
      const clearSearchBtn = document.getElementById('btn-clear-search');

      searchInput.addEventListener('input', (e) => {
        searchKeyword = e.target.value;
        clearSearchBtn.style.display = searchKeyword ? 'inline-flex' : 'none';
        renderLayerList();
      });

      clearSearchBtn.addEventListener('click', () => {
        searchKeyword = '';
        searchInput.value = '';
        clearSearchBtn.style.display = 'none';
        renderLayerList();
      });

      // 初始化渲染
      applyTheme('dark');
      renderLayerList();
    })();
  </script>
</body>
</html>
